name: 发布桌面应用

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建 ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-latest
            args: --x64 --arm64
          - platform: win
            runner: windows-latest
            args: ''
          - platform: linux
            runner: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 pnpm
        run: npm install --global pnpm@11.19.0
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建并发布
        run: pnpm exec electron-builder --${{ matrix.platform }} ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
